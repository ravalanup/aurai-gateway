[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurai-gateway"
version = "0.1.0"
description = "Aurai AI gateway: LiteLLM configuration, tiered PII guardrail and team policy tooling"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
aurai-teamctl = "aurai_gateway.teamctl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aurai_gateway = ["policies/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
