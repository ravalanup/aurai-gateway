{{- if .Values.externalSecrets.enabled }}
# Builds the litellm Secret from AWS Secrets Manager. Requires the External Secrets Operator and the
# ClusterSecretStore created by aurai-infra.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.litellm.existingSecret }}
  labels:
    {{- include "aurai-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ .Values.litellm.existingSecret }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        master-key: "{{ "{{ .masterKey }}" }}"
        salt-key: "{{ "{{ .saltKey }}" }}"
        anthropic-api-key: "{{ "{{ .anthropic }}" }}"
        gemini-api-key: "{{ "{{ .gemini }}" }}"
        openai-api-key: "{{ "{{ .openai }}" }}"
        database-url: "postgresql://{{ "{{ .dbUser | urlquery }}" }}:{{ "{{ .dbPassword | urlquery }}" }}@{{ required "externalSecrets.databaseHost is required" .Values.externalSecrets.databaseHost }}:{{ .Values.externalSecrets.databasePort }}/{{ .Values.database.name }}?sslmode={{ .Values.externalSecrets.databaseSslMode }}"
        database-admin-url: "postgresql://{{ "{{ .dbUser | urlquery }}" }}:{{ "{{ .dbPassword | urlquery }}" }}@{{ .Values.externalSecrets.databaseHost }}:{{ .Values.externalSecrets.databasePort }}/postgres?sslmode={{ .Values.externalSecrets.databaseSslMode }}"
  data:
    - secretKey: masterKey
      remoteRef:
        key: {{ required "externalSecrets.masterKeyRemoteKey is required" .Values.externalSecrets.masterKeyRemoteKey }}
    - secretKey: saltKey
      remoteRef:
        key: {{ required "externalSecrets.saltKeyRemoteKey is required" .Values.externalSecrets.saltKeyRemoteKey }}
    - secretKey: anthropic
      remoteRef:
        key: {{ required "externalSecrets.providerKeysRemoteKey is required" .Values.externalSecrets.providerKeysRemoteKey }}
        property: anthropic
    - secretKey: gemini
      remoteRef:
        key: {{ .Values.externalSecrets.providerKeysRemoteKey }}
        property: gemini
    - secretKey: openai
      remoteRef:
        key: {{ .Values.externalSecrets.providerKeysRemoteKey }}
        property: openai
    - secretKey: dbUser
      remoteRef:
        key: {{ required "externalSecrets.databaseSecretRemoteKey is required" .Values.externalSecrets.databaseSecretRemoteKey }}
        property: username
    - secretKey: dbPassword
      remoteRef:
        key: {{ .Values.externalSecrets.databaseSecretRemoteKey }}
        property: password
{{- end }}
