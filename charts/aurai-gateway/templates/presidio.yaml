apiVersion: v1
kind: Service
metadata:
  name: presidio-analyzer
  labels:
    {{- include "aurai-gateway.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: presidio-analyzer
  ports:
    - name: http
      port: {{ .Values.presidio.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-analyzer
  labels:
    app.kubernetes.io/name: presidio-analyzer
    {{- include "aurai-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.presidio.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: presidio-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presidio-analyzer
        {{- include "aurai-gateway.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: presidio-analyzer
          image: {{ .Values.presidio.image }}
          ports:
            - name: http
              containerPort: {{ .Values.presidio.port }}
          env:
            - name: PORT
              value: {{ .Values.presidio.port | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            {{- toYaml .Values.presidio.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
