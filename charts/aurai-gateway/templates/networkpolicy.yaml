{{- if .Values.networkPolicy.enabled }}
# Ingress is denied by default. kind's default network plugin does not enforce NetworkPolicy; EKS needs
# network policy support enabled in the VPC CNI or a policy engine.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "aurai-gateway.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-litellm-from-platform
  labels:
    {{- include "aurai-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes: [Ingress]
  ingress:
    - from:
        # Aurai namespaces (workspace, agents, knowledge) carry this label from aurai-infra.
        - namespaceSelector:
            matchLabels:
              aurai.io/platform-access: "true"
        - podSelector: {}
      ports:
        - port: {{ .Values.litellm.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-presidio-from-litellm
  labels:
    {{- include "aurai-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: presidio-analyzer
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: {{ .Values.presidio.port }}
{{- end }}
